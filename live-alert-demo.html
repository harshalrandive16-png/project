<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Alert Demo - BhoomiSuraksha v5.2</title>
    
    <!-- Global Config (Must load first) -->
    <script src="config.js"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050810;
            --card-bg: rgba(15, 21, 35, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: #0a0f18;
            --input-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --accent-green: #10b981;
            --danger-red: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .alert-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 35px 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .badge {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        h2 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .hint-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .hint-text.green { color: var(--accent-green); }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger-red), var(--danger-hover));
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
        }

        .btn-danger:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .footer-info {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #586985;
            line-height: 1.6;
        }
        .footer-info span { color: var(--accent-green); font-weight: 600; }
        
        #statusMsg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .status-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; }
        .status-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
    </style>
</head>
<body>

    <div class="alert-card">
        <div class="badge">🚨 FAST2SMS REAL MOBILE ALERT</div>
        
        <h2>Dispatch Emergency SMS & Siren</h2>
        <div class="subtitle">BhoomiSuraksha · Pan-India Early Warning System</div>

        <form id="dispatchForm">
            <div class="form-group">
                <label>10-Digit Indian Mobile Number(s)</label>
                <input type="text" id="mobileNumbers" placeholder="e.g. 9876543210" value="8766028491" required>
                <div class="hint-text green">✅ Fast2SMS API V2 Gateway Active</div>
                <div class="hint-text">💡 Multiple numbers comma se: 9876543210, 9123456789</div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Disaster Hazard</label>
                    <select id="hazardType">
                        <option value="Severe Flood Hazard">Severe Flood Hazard</option>
                        <option value="Cyclone Alert">Cyclone Alert</option>
                        <option value="Landslide Warning">Landslide Warning</option>
                        <option value="Earthquake Detected">Earthquake Detected</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Geofence Radius</label>
                    <select id="radius">
                        <option value="15">15 km Radius</option>
                        <option value="30">30 km Radius</option>
                        <option value="50">50 km Radius</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" id="location" value="Nagpur, Maharashtra" required>
            </div>

            <div class="form-group">
                <label>Custom SMS Message (Optional)</label>
                <textarea id="customMsg" placeholder="Empty = auto NDMA emergency format"></textarea>
            </div>

            <button type="submit" class="btn-danger" id="submitBtn">
                🚀 Send Emergency SMS + Play Emergency Siren
            </button>
        </form>

        <div id="statusMsg"></div>

        <div class="footer-info">
            Gateway: <span>Fast2SMS bulkV2</span> · Helpline: 112 / NDRF 1070<br>
            Pipeline: SENSE → PREDICT → ALERT → RESPOND
        </div>
    </div>

    <script>
        let audioCtx;

        function triggerSirenAndFlash() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1600, audioCtx.currentTime + 0.5);
                osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 1.0);

                let sweepCount = 0;
                const interval = setInterval(() => {
                    sweepCount++;
                    if (sweepCount >= 3) {
                        clearInterval(interval);
                    } else {
                        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                        osc.frequency.linearRampToValueAtTime(1600, audioCtx.currentTime + 0.5);
                        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 1.0);
                    }
                }, 1000);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 3);

                // Screen Red Flash Effect
                document.body.style.transition = "background-color 0.2s";
                document.body.style.backgroundColor = "#450a0a";
                setTimeout(() => { document.body.style.backgroundColor = "#050810"; }, 3000);
            } catch (err) {
                console.warn("Audio Context Error:", err);
            }
        }

        document.getElementById('dispatchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusMsg');
            const originalText = btn.innerHTML;

            // Trigger Siren and Visual Flash IMMEDIATELY
            triggerSirenAndFlash();

            btn.innerHTML = '⏳ Dispatching Alert...';
            btn.disabled = true;
            statusBox.style.display = 'none';

            const payload = {
                numbers: document.getElementById('mobileNumbers').value.split(',').map(n => n.trim()),
                hazard: document.getElementById('hazardType').value,
                radius: document.getElementById('radius').value,
                location: document.getElementById('location').value,
                customMessage: document.getElementById('customMsg').value
            };

            try {
                const apiEndpoint = `${window.BHOOMI_API || 'http://localhost:5000'}/api/sms/send-test`;
                const headers = window.getAuthHeaders ? window.getAuthHeaders() : { 'Content-Type': 'application/json' };

                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    btn.innerHTML = '✅ Dispatch Triggered!';
                    statusBox.className = 'status-success';
                    statusBox.innerHTML = `<strong>Success (${data.mode || 'OK'}):</strong> ${data.message}`;
                    statusBox.style.display = 'block';
                } else {
                    throw new Error(data.message || 'Dispatch failed on server');
                }
            } catch (err) {
                console.error("Dispatch Error:", err);
                statusBox.className = 'status-error';
                statusBox.innerHTML = `<strong>⚠️ Alert:</strong> ${err.message}<br><small>Target API: ${window.BHOOMI_API}</small>`;
                statusBox.style.display = 'block';
            } finally {
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 3000);
            }
        });
    </script>
</body>
</html>
